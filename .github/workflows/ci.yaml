name: CPU checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e '.[dev]'
      - run: ruff check .
      - run: python -m py_compile experiments/*.py experiments/next_token/*.py experiments/nanogpt_speedrun/*.py optimizers/*.py
      - run: python scripts/validate_configs.py
      - run: pytest -q
